name: Build AmpTV APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK command-line tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AMPTV_KEYSTORE_BASE64 }}
          AMPTV_KEYSTORE_PASSWORD: ${{ secrets.AMPTV_KEYSTORE_PASSWORD }}
          AMPTV_KEY_ALIAS: ${{ secrets.AMPTV_KEY_ALIAS }}
          AMPTV_KEY_PASSWORD: ${{ secrets.AMPTV_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$AMPTV_KEYSTORE_PASSWORD"
          test -n "$AMPTV_KEY_ALIAS"
          test -n "$AMPTV_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/amptv.jks"
          chmod 600 "$RUNNER_TEMP/amptv.jks"
          echo "AMPTV_SIGNING_STORE_FILE=$RUNNER_TEMP/amptv.jks" >> "$GITHUB_ENV"
          echo "AMPTV_KEYSTORE_PASSWORD=$AMPTV_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AMPTV_KEY_ALIAS=$AMPTV_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AMPTV_KEY_PASSWORD=$AMPTV_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmpTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish installable APK as GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" app/build/outputs/apk/debug/app-debug.apk --title "AmpTV build ${GITHUB_RUN_NUMBER}" --notes "Automated debug APK for testing on Google TV." --latest
